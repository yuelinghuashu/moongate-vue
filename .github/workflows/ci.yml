name: CI

on:
  push:
    branches: [main]

jobs:
  quality:
    name: Test + Lint + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec vue-tsc -p tsconfig.build.json --noEmit --skipLibCheck

      - name: Lint
        run: pnpm lint:no-fix

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build
